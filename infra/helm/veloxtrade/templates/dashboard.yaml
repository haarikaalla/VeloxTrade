apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    app.kubernetes.io/name: veloxtrade-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels: { app: veloxtrade-dashboard }
  template:
    metadata:
      labels: { app: veloxtrade-dashboard }
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.imageRegistry }}/{{ .Values.dashboard.image }}:{{ .Values.dashboard.tag }}"
          ports: [{ containerPort: 80 }]
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
spec:
  type: ClusterIP
  selector: { app: veloxtrade-dashboard }
  ports: [{ port: {{ .Values.dashboard.port }}, targetPort: 80 }]
