{{- if not .Values.platform.existingDatabaseSecret }}
{{- if not .Values.platform.jwtSecret }}
{{- fail "platform.jwtSecret is required. Set it with --set platform.jwtSecret=<at least 32 random characters>" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-platform
type: Opaque
stringData:
  jwt-secret: {{ .Values.platform.jwtSecret | quote }}
  datasource-password: {{ required "platform.datasourcePassword is required when no existing secret is supplied" .Values.platform.datasourcePassword | quote }}
{{- end }}
