name: veloxtrade

services:
  dashboard:
    build: ./dashboard-angular
    container_name: veloxtrade-dashboard
    ports: ["4200:80"]
    depends_on:
      platform:
        condition: service_healthy
    restart: unless-stopped

  platform:
    build: ./platform-java
    container_name: veloxtrade-platform
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/veloxtrade
      SPRING_DATASOURCE_USERNAME: velox
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-velox_local_only}
      SPRING_DATA_REDIS_HOST: redis
      VELOXTRADE_ENGINE_URL: http://engine:8081
      VELOXTRADE_ANALYTICS_URL: http://analytics:8000
      VELOXTRADE_ALLOWED_ORIGINS: http://localhost:4200
      # Local-only default. Always override in shared or public deployments.
      VELOXTRADE_JWT_SECRET: ${VELOXTRADE_JWT_SECRET:-local-development-secret-change-me-32b}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
      analytics:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build: ./ml-python
    container_name: veloxtrade-analytics
    ports: ["8000:8000"]
    restart: unless-stopped

  engine:
    build: ./engine-cpp
    container_name: veloxtrade-engine
    expose: ["8081"]
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: veloxtrade-postgres
    environment:
      POSTGRES_DB: veloxtrade
      POSTGRES_USER: velox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velox_local_only}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velox -d veloxtrade"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: veloxtrade-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: veloxtrade-prometheus
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [platform]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: veloxtrade-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-veloxtrade}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
