spring:
  application:
    name: veloxtrade-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veloxtrade}
    username: ${SPRING_DATASOURCE_USERNAME:velox}
    password: ${SPRING_DATASOURCE_PASSWORD:velox_local_only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: veloxtrade-platform

springdoc:
  swagger-ui:
    path: /swagger-ui.html

veloxtrade:
  symbol: VLX
  opening-cash: 100000.00
  tick-interval: 1s
  allowed-origins: ${VELOXTRADE_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  engine:
    base-url: ${VELOXTRADE_ENGINE_URL:http://localhost:8081}
    timeout: 2s
  analytics:
    base-url: ${VELOXTRADE_ANALYTICS_URL:http://localhost:8000}
    timeout: 3s
  security:
    # Provide a value of at least 32 characters in every real deployment.
    jwt-secret: ${VELOXTRADE_JWT_SECRET:}
    token-ttl: 12h

logging:
  level:
    com.veloxtrade: INFO
