<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="VeloxTrade - Real-Time Market Simulation and Analytics Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04100d"/>
      <stop offset="55%" stop-color="#082019"/>
      <stop offset="100%" stop-color="#03110f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67f0a2"/>
      <stop offset="100%" stop-color="#3ad1f0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67f0a2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#67f0a2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#67f0a2" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200"/>
    <path d="M150 0v300M300 0v300M450 0v300M600 0v300M750 0v300M900 0v300M1050 0v300"/>
  </g>

  <!-- price line -->
  <path d="M0 232 L70 214 L140 226 L210 190 L280 202 L350 168 L420 182 L490 146 L560 158 L630 124 L700 140 L770 106 L840 120 L910 88 L980 100 L1050 70 L1120 82 L1200 54 L1200 300 L0 300 Z" fill="url(#fade)"/>
  <path d="M0 232 L70 214 L140 226 L210 190 L280 202 L350 168 L420 182 L490 146 L560 158 L630 124 L700 140 L770 106 L840 120 L910 88 L980 100 L1050 70 L1120 82 L1200 54"
        fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="1050" cy="70" r="6" fill="#67f0a2" filter="url(#glow)"/>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="122" font-size="66" font-weight="800" fill="#eafff4" letter-spacing="-1.5">
      VELOX<tspan fill="url(#accent)">TRADE</tspan>
    </text>
    <text x="76" y="160" font-size="20" font-weight="600" fill="#8fb6a7" letter-spacing="3.4">
      REAL-TIME MARKET SIMULATION &amp; ANALYTICS ENGINE
    </text>

    <g font-size="15" font-weight="700" fill="#0a1a15">
      <rect x="76"  y="188" width="86"  height="30" rx="15" fill="#67f0a2" opacity="0.92"/>
      <text x="119" y="208" text-anchor="middle">C++20</text>

      <rect x="172" y="188" width="132" height="30" rx="15" fill="#67f0a2" opacity="0.82"/>
      <text x="238" y="208" text-anchor="middle">SPRING BOOT</text>

      <rect x="314" y="188" width="110" height="30" rx="15" fill="#67f0a2" opacity="0.72"/>
      <text x="369" y="208" text-anchor="middle">FASTAPI</text>

      <rect x="434" y="188" width="122" height="30" rx="15" fill="#67f0a2" opacity="0.62"/>
      <text x="495" y="208" text-anchor="middle">ANGULAR 19</text>

      <rect x="566" y="188" width="128" height="30" rx="15" fill="#67f0a2" opacity="0.52"/>
      <text x="630" y="208" text-anchor="middle">KUBERNETES</text>
    </g>

    <text x="76" y="256" font-size="14" fill="#5d8375" font-style="italic">
      Simulated data only — not a real exchange, not investment advice.
    </text>
  </g>
</svg>
