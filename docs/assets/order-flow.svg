<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animated order lifecycle: dashboard to platform to engine and back">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d211c"/>
      <stop offset="100%" stop-color="#0a1a16"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" fill="#07120f"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="34" y="36" font-size="15" font-weight="700" fill="#eafff4">Order lifecycle</text>
    <text x="34" y="56" font-size="11" fill="#5d8375">Browser → Spring Boot → C++ engine → fills applied → live broadcast</text>

    <!-- nodes -->
    <rect x="34"  y="92" width="180" height="72" rx="12" fill="url(#c)" stroke="#67f0a2" stroke-opacity="0.45"/>
    <text x="124" y="124" font-size="13" font-weight="700" fill="#67f0a2" text-anchor="middle">Angular</text>
    <text x="124" y="144" font-size="10" fill="#9dc0b2" text-anchor="middle">POST /api/orders</text>

    <rect x="290" y="92" width="200" height="72" rx="12" fill="url(#c)" stroke="#67f0a2" stroke-opacity="0.7"/>
    <text x="390" y="118" font-size="13" font-weight="700" fill="#67f0a2" text-anchor="middle">Spring Boot</text>
    <text x="390" y="136" font-size="10" fill="#9dc0b2" text-anchor="middle">JWT · buying power</text>
    <text x="390" y="152" font-size="10" fill="#9dc0b2" text-anchor="middle">transactional fills</text>

    <rect x="566" y="92" width="180" height="72" rx="12" fill="url(#c)" stroke="#3ad1f0" stroke-opacity="0.6"/>
    <text x="656" y="118" font-size="13" font-weight="700" fill="#3ad1f0" text-anchor="middle">C++ engine</text>
    <text x="656" y="136" font-size="10" fill="#9dc0b2" text-anchor="middle">price-time match</text>
    <text x="656" y="152" font-size="10" fill="#9dc0b2" text-anchor="middle">ns latency stamp</text>

    <rect x="800" y="92" width="66" height="72" rx="12" fill="url(#c)" stroke="#4d7a6b"/>
    <text x="833" y="124" font-size="11" font-weight="700" fill="#cfe6db" text-anchor="middle">DB</text>
    <text x="833" y="142" font-size="9" fill="#9dc0b2" text-anchor="middle">ticks</text>

    <!-- static wires -->
    <g stroke="#1b3a32" stroke-width="2" fill="none">
      <path d="M214 128 H290"/>
      <path d="M490 128 H566"/>
      <path d="M746 128 H800"/>
    </g>

    <!-- travelling packets -->
    <circle r="5" fill="#67f0a2" filter="url(#g)">
      <animateMotion dur="3s" repeatCount="indefinite"
        path="M214 128 H290" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#3ad1f0" filter="url(#g)">
      <animateMotion dur="3s" begin="0.7s" repeatCount="indefinite" path="M490 128 H566"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#67f0a2" filter="url(#g)">
      <animateMotion dur="3s" begin="1.4s" repeatCount="indefinite" path="M566 150 H490"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#4d7a6b" filter="url(#g)">
      <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M746 128 H800"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>

    <!-- return path label -->
    <path d="M566 150 H490" stroke="#1b3a32" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <text x="528" y="176" font-size="9" fill="#5d8375" text-anchor="middle">fills</text>

    <!-- ticker -->
    <text x="34" y="222" font-size="11" fill="#5d8375">STOMP push</text>
    <rect x="124" y="208" width="742" height="20" rx="10" fill="#0a1a16" stroke="#1b3a32"/>
    <g font-size="10" font-family="'Consolas', monospace" fill="#67f0a2">
      <text x="140" y="222">
        VLX 192.54 ▲ · FILLED 10 @ 192.54 · 1.8 µs · book depth 14 · signal UP 0.62
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
