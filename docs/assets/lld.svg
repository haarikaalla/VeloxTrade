<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="1200" height="1350" role="img" aria-label="VeloxTrade low-level design diagram">
  <defs>
    <linearGradient id="lldCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123029"/>
      <stop offset="100%" stop-color="#0d221d"/>
    </linearGradient>
    <linearGradient id="lldChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16382f"/>
      <stop offset="100%" stop-color="#0f2823"/>
    </linearGradient>
    <marker id="lldArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#67f0a2"/>
    </marker>
    <marker id="lldArrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ad1f0"/>
    </marker>
  </defs>

  <rect width="1200" height="1350" fill="#07120f"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="40" y="52" font-size="26" font-weight="800" fill="#eafff4">VeloxTrade &#8212; Low-Level Design</text>
    <text x="40" y="80" font-size="14" fill="#7fa596">Component and class-level view: what actually runs inside each service, and how a single order becomes cash and a position.</text>

    <!-- ================= ENGINE ================= -->
    <g>
      <rect x="40" y="106" width="1120" height="252" rx="16" fill="none" stroke="#3ad1f0" stroke-opacity="0.35" stroke-dasharray="6 5"/>
      <text x="64" y="136" font-size="17" font-weight="700" fill="#3ad1f0">engine-cpp &#8212; matching engine internals</text>
      <text x="1136" y="136" font-size="11" font-weight="700" fill="#4d7a6b" text-anchor="end">C++20 &#183; no third-party libraries</text>

      <rect x="64" y="152" width="320" height="186" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="84" y="180" font-size="14" font-weight="700" fill="#cfe6db">HttpServer</text>
      <text x="84" y="204" font-size="11.5" fill="#9dc0b2">Blocking accept loop, backlog 64</text>
      <text x="84" y="225" font-size="11.5" fill="#9dc0b2">Detached std::thread per connection</text>
      <text x="84" y="246" font-size="11.5" fill="#9dc0b2">Binds 0.0.0.0 on ENGINE_PORT (8081)</text>
      <text x="84" y="267" font-size="11.5" fill="#9dc0b2">Hand-written HTTP/1.1 parsing</text>
      <text x="84" y="288" font-size="11.5" fill="#9dc0b2">Hand-written JSON serialisation</text>
      <text x="84" y="315" font-size="11" fill="#5f8878">405 on wrong method &#183; 404 on unknown path</text>

      <rect x="405" y="152" width="320" height="186" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="425" y="180" font-size="14" font-weight="700" fill="#cfe6db">EngineService</text>
      <text x="425" y="204" font-size="11.5" fill="#9dc0b2">GET /health &#183; /quote &#183; /depth (8 levels)</text>
      <text x="425" y="225" font-size="11.5" fill="#9dc0b2">POST /orders &#8594; submit_json()</text>
      <text x="425" y="246" font-size="11.5" fill="#9dc0b2">std::mutex guards every book access</text>
      <text x="425" y="267" font-size="11.5" fill="#9dc0b2">steady_clock &#8594; matchLatencyNanos</text>
      <text x="425" y="288" font-size="11.5" fill="#9dc0b2">drift() thread every 500 ms</text>
      <text x="425" y="315" font-size="11" fill="#5f8878">normal(0, 18 ticks) &#183; reseeds 6 levels/side</text>

      <rect x="746" y="152" width="390" height="186" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="766" y="180" font-size="14" font-weight="700" fill="#cfe6db">OrderBook</text>
      <text x="766" y="204" font-size="11.5" fill="#9dc0b2">bids: map&#60;int64_t, deque&#60;Order&#62;, greater&#62;</text>
      <text x="766" y="225" font-size="11.5" fill="#9dc0b2">asks: map&#60;int64_t, deque&#60;Order&#62;, less&#62;</text>
      <text x="766" y="246" font-size="11.5" fill="#9dc0b2">Prices are integer ticks (cents) &#8212; no floats</text>
      <text x="766" y="267" font-size="11.5" fill="#9dc0b2">submit(): cross best price, FIFO in a level</text>
      <text x="766" y="288" font-size="11.5" fill="#9dc0b2">cancel(): scan ladders, erase empty level</text>
      <text x="766" y="315" font-size="11" fill="#5f8878">MatchResult = fills[] + resting remainder</text>
    </g>

    <g stroke-width="2" fill="none">
      <path d="M384 245 H405" stroke="#3ad1f0" marker-end="url(#lldArrowCyan)"/>
      <path d="M725 245 H746" stroke="#3ad1f0" marker-end="url(#lldArrowCyan)"/>
    </g>

    <!-- ================= PLATFORM ================= -->
    <g>
      <rect x="40" y="382" width="1120" height="452" rx="16" fill="none" stroke="#67f0a2" stroke-opacity="0.35" stroke-dasharray="6 5"/>
      <text x="64" y="412" font-size="17" font-weight="700" fill="#67f0a2">platform-java &#8212; layered Spring Boot service</text>
      <text x="1136" y="412" font-size="11" font-weight="700" fill="#4d7a6b" text-anchor="end">web &#8594; service &#8594; repository &#8594; PostgreSQL</text>

      <rect x="64" y="430" width="252" height="196" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="82" y="457" font-size="13.5" font-weight="700" fill="#cfe6db">web</text>
      <text x="82" y="481" font-size="11" fill="#9dc0b2">AuthController</text>
      <text x="82" y="501" font-size="11" fill="#9dc0b2">TradingController</text>
      <text x="82" y="521" font-size="11" fill="#9dc0b2">MarketController</text>
      <text x="82" y="541" font-size="11" fill="#9dc0b2">ApiExceptionHandler</text>
      <text x="82" y="569" font-size="10.5" fill="#5f8878">Bean Validation &#8594; 400</text>
      <text x="82" y="587" font-size="10.5" fill="#5f8878">TradingRuleException &#8594; 422</text>
      <text x="82" y="605" font-size="10.5" fill="#5f8878">UpstreamUnavailable &#8594; 503</text>

      <rect x="337" y="430" width="252" height="196" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="355" y="457" font-size="13.5" font-weight="700" fill="#cfe6db">service</text>
      <text x="355" y="481" font-size="11" fill="#9dc0b2">TradingService</text>
      <text x="355" y="501" font-size="11" fill="#9dc0b2">PortfolioService</text>
      <text x="355" y="521" font-size="11" fill="#9dc0b2">AccountService</text>
      <text x="355" y="541" font-size="11" fill="#9dc0b2">MarketDataService</text>
      <text x="355" y="569" font-size="10.5" fill="#5f8878">@Scheduled 1 s engine poll</text>
      <text x="355" y="587" font-size="10.5" fill="#5f8878">Redis veloxtrade:quote:VLX</text>
      <text x="355" y="605" font-size="10.5" fill="#5f8878">5 min TTL &#183; Redis optional</text>

      <rect x="610" y="430" width="252" height="196" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="628" y="457" font-size="13.5" font-weight="700" fill="#cfe6db">repository + domain</text>
      <text x="628" y="481" font-size="11" fill="#9dc0b2">AccountRepository</text>
      <text x="628" y="501" font-size="11" fill="#9dc0b2">PositionRepository</text>
      <text x="628" y="521" font-size="11" fill="#9dc0b2">TradeOrderRepository</text>
      <text x="628" y="541" font-size="11" fill="#9dc0b2">MarketTickRepository</text>
      <text x="628" y="569" font-size="10.5" fill="#5f8878">Account &#183; Position &#183; TradeOrder</text>
      <text x="628" y="587" font-size="10.5" fill="#5f8878">MarketTick &#183; OrderSide/Status</text>
      <text x="628" y="605" font-size="10.5" fill="#5f8878">Flyway V1 owns the schema</text>

      <rect x="883" y="430" width="253" height="196" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="901" y="457" font-size="13.5" font-weight="700" fill="#cfe6db">security + config</text>
      <text x="901" y="481" font-size="11" fill="#9dc0b2">JwtService (HS256, 12 h)</text>
      <text x="901" y="501" font-size="11" fill="#9dc0b2">JwtAuthenticationFilter</text>
      <text x="901" y="521" font-size="11" fill="#9dc0b2">SecurityConfig (stateless)</text>
      <text x="901" y="541" font-size="11" fill="#9dc0b2">HttpClientConfig &#183; WebSocketConfig</text>
      <text x="901" y="569" font-size="10.5" fill="#5f8878">RestClient beans: engine 2 s,</text>
      <text x="901" y="587" font-size="10.5" fill="#5f8878">analytics 3 s timeouts</text>
      <text x="901" y="605" font-size="10.5" fill="#5f8878">Short secret &#8594; ephemeral key</text>

      <!-- pipeline -->
      <rect x="64" y="650" width="1072" height="164" rx="12" fill="none" stroke="#20423a"/>
      <text x="84" y="678" font-size="13.5" font-weight="700" fill="#67f0a2">TradingService.placeOrder(accountId, request) &#8212; a single @Transactional unit of work</text>

      <rect x="84" y="694" width="190" height="100" rx="10" fill="url(#lldChip)" stroke="#4d7a6b"/>
      <text x="100" y="718" font-size="12" font-weight="700" fill="#67f0a2">1 &#183; Validate</text>
      <text x="100" y="740" font-size="10.5" fill="#9dc0b2">symbol must equal VLX</text>
      <text x="100" y="758" font-size="10.5" fill="#9dc0b2">account must exist</text>
      <text x="100" y="778" font-size="10.5" fill="#5f8878">else 422</text>

      <rect x="302" y="694" width="190" height="100" rx="10" fill="url(#lldChip)" stroke="#4d7a6b"/>
      <text x="318" y="718" font-size="12" font-weight="700" fill="#67f0a2">2 &#183; Risk checks</text>
      <text x="318" y="740" font-size="10.5" fill="#9dc0b2">BUY: cash &#8805; price x qty</text>
      <text x="318" y="758" font-size="10.5" fill="#9dc0b2">SELL: held qty &#8805; qty</text>
      <text x="318" y="778" font-size="10.5" fill="#5f8878">no short selling</text>

      <rect x="520" y="694" width="190" height="100" rx="10" fill="url(#lldChip)" stroke="#4d7a6b"/>
      <text x="536" y="718" font-size="12" font-weight="700" fill="#67f0a2">3 &#183; Match</text>
      <text x="536" y="740" font-size="10.5" fill="#9dc0b2">EngineClient RestClient</text>
      <text x="536" y="758" font-size="10.5" fill="#9dc0b2">POST engine /orders</text>
      <text x="536" y="778" font-size="10.5" fill="#5f8878">upstream down &#8594; 503</text>

      <rect x="738" y="694" width="190" height="100" rx="10" fill="url(#lldChip)" stroke="#4d7a6b"/>
      <text x="754" y="718" font-size="12" font-weight="700" fill="#67f0a2">4 &#183; Apply fills</text>
      <text x="754" y="740" font-size="10.5" fill="#9dc0b2">Position.apply() weighted</text>
      <text x="754" y="758" font-size="10.5" fill="#9dc0b2">average cost basis</text>
      <text x="754" y="778" font-size="10.5" fill="#5f8878">debit BUY / credit SELL</text>

      <rect x="956" y="694" width="180" height="100" rx="10" fill="url(#lldChip)" stroke="#4d7a6b"/>
      <text x="972" y="718" font-size="12" font-weight="700" fill="#67f0a2">5 &#183; Persist</text>
      <text x="972" y="740" font-size="10.5" fill="#9dc0b2">position + account</text>
      <text x="972" y="758" font-size="10.5" fill="#9dc0b2">TradeOrder receipt</text>
      <text x="972" y="778" font-size="10.5" fill="#5f8878">@Version guards races</text>
    </g>

    <g stroke-width="2" fill="none">
      <path d="M316 528 H337" stroke="#67f0a2" marker-end="url(#lldArrow)"/>
      <path d="M589 528 H610" stroke="#67f0a2" marker-end="url(#lldArrow)"/>
      <path d="M862 528 H883" stroke="#67f0a2" stroke-dasharray="4 4" marker-end="url(#lldArrow)"/>
      <path d="M274 744 H302" stroke="#67f0a2" marker-end="url(#lldArrow)"/>
      <path d="M492 744 H520" stroke="#67f0a2" marker-end="url(#lldArrow)"/>
      <path d="M710 744 H738" stroke="#67f0a2" marker-end="url(#lldArrow)"/>
      <path d="M928 744 H956" stroke="#67f0a2" marker-end="url(#lldArrow)"/>
    </g>

    <!-- ================= ANALYTICS ================= -->
    <g>
      <rect x="40" y="858" width="545" height="256" rx="16" fill="none" stroke="#f0c93a" stroke-opacity="0.35" stroke-dasharray="6 5"/>
      <text x="64" y="888" font-size="17" font-weight="700" fill="#f0c93a">ml-python &#8212; analytics internals</text>

      <rect x="64" y="904" width="497" height="192" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="84" y="930" font-size="12.5" font-weight="700" fill="#cfe6db">app/main.py</text>
      <text x="84" y="952" font-size="11" fill="#9dc0b2">GET /health &#183; POST /predict</text>
      <text x="84" y="972" font-size="11" fill="#9dc0b2">Request: symbol, lastPrice, recentReturns[] (max 120)</text>
      <text x="84" y="992" font-size="11" fill="#9dc0b2">Response: direction, confidence, momentum, volatility</text>
      <text x="84" y="1020" font-size="12.5" font-weight="700" fill="#cfe6db">app/model.py</text>
      <text x="84" y="1042" font-size="11" fill="#9dc0b2">momentum = _ewma(returns, half_life = 8.0)</text>
      <text x="84" y="1062" font-size="11" fill="#9dc0b2">scaled = momentum / (_volatility(returns) + 1e-6)</text>
      <text x="84" y="1082" font-size="11" fill="#9dc0b2">P(up) = 1 / (1 + exp(-4.0 &#215; scaled)) &#8594; UP / DOWN / FLAT</text>
    </g>

    <!-- ================= DASHBOARD ================= -->
    <g>
      <rect x="615" y="858" width="545" height="256" rx="16" fill="none" stroke="#67f0a2" stroke-opacity="0.35" stroke-dasharray="6 5"/>
      <text x="639" y="888" font-size="17" font-weight="700" fill="#67f0a2">dashboard-angular &#8212; client internals</text>

      <rect x="639" y="904" width="497" height="192" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="659" y="930" font-size="12.5" font-weight="700" fill="#cfe6db">core/</text>
      <text x="659" y="952" font-size="11" fill="#9dc0b2">AuthService: session signal mirrored to sessionStorage</text>
      <text x="659" y="972" font-size="11" fill="#9dc0b2">authInterceptor: Bearer on /api, logout on 401</text>
      <text x="659" y="992" font-size="11" fill="#9dc0b2">MarketStreamService: @stomp/stompjs over /ws</text>
      <text x="659" y="1012" font-size="11" fill="#5f8878">/topic/market/VLX &#183; /topic/depth/VLX &#183; 4 s reconnect</text>
      <text x="659" y="1040" font-size="12.5" font-weight="700" fill="#cfe6db">app/</text>
      <text x="659" y="1062" font-size="11" fill="#9dc0b2">AppComponent: interval(2000) REST fallback when offline</text>
      <text x="659" y="1082" font-size="11" fill="#9dc0b2">price-chart &#183; order-book &#183; auth-panel (standalone, OnPush)</text>
    </g>

    <!-- ================= DATA MODEL ================= -->
    <g>
      <rect x="40" y="1138" width="1120" height="188" rx="16" fill="none" stroke="#4d7a6b" stroke-dasharray="6 5"/>
      <text x="64" y="1168" font-size="17" font-weight="700" fill="#cfe6db">Persistence model &#8212; Flyway V1__baseline.sql</text>

      <rect x="64" y="1184" width="250" height="118" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="82" y="1210" font-size="13" font-weight="700" fill="#67f0a2">accounts</text>
      <text x="82" y="1232" font-size="10.5" fill="#9dc0b2">id uuid pk &#183; email unique</text>
      <text x="82" y="1252" font-size="10.5" fill="#9dc0b2">password_hash (BCrypt 12)</text>
      <text x="82" y="1272" font-size="10.5" fill="#9dc0b2">cash_balance numeric(19,2)</text>
      <text x="82" y="1292" font-size="10.5" fill="#5f8878">opens with 100,000</text>

      <rect x="338" y="1184" width="250" height="118" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="356" y="1210" font-size="13" font-weight="700" fill="#67f0a2">positions</text>
      <text x="356" y="1232" font-size="10.5" fill="#9dc0b2">unique (account_id, symbol)</text>
      <text x="356" y="1252" font-size="10.5" fill="#9dc0b2">quantity &#183; average_price(19,4)</text>
      <text x="356" y="1272" font-size="10.5" fill="#9dc0b2">version = @Version column</text>
      <text x="356" y="1292" font-size="10.5" fill="#5f8878">optimistic locking</text>

      <rect x="612" y="1184" width="250" height="118" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="630" y="1210" font-size="13" font-weight="700" fill="#67f0a2">orders</text>
      <text x="630" y="1232" font-size="10.5" fill="#9dc0b2">side / status stored as text</text>
      <text x="630" y="1252" font-size="10.5" fill="#9dc0b2">filled_quantity &#183; avg fill price</text>
      <text x="630" y="1272" font-size="10.5" fill="#9dc0b2">engine_order_id</text>
      <text x="630" y="1292" font-size="10.5" fill="#5f8878">match_latency_nanos</text>

      <rect x="886" y="1184" width="250" height="118" rx="12" fill="url(#lldCard)" stroke="#4d7a6b"/>
      <text x="904" y="1210" font-size="13" font-weight="700" fill="#67f0a2">market_ticks</text>
      <text x="904" y="1232" font-size="10.5" fill="#9dc0b2">pk (id, observed_at)</text>
      <text x="904" y="1252" font-size="10.5" fill="#9dc0b2">price &#183; bid &#183; ask numeric(19,4)</text>
      <text x="904" y="1272" font-size="10.5" fill="#9dc0b2">TimescaleDB hypertable</text>
      <text x="904" y="1292" font-size="10.5" fill="#5f8878">plain table if unavailable</text>
    </g>
  </g>
</svg>
